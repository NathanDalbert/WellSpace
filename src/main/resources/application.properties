spring.application.name=WellSpace

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/WellSpace}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:admin}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.orm.deprecation=WARN
spring.jpa.hibernate.ddl-auto=update

springdoc.api-docs.enabled=true
springdoc.api-docs.title=API WellSpace
springdoc.api-docs.version=OPENAPI_3_0

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

api.security.token.secret=${API_SECRET}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}

app.frontend.reset-url=${APP_FRONTEND_URL}
app.frontend.url=${APP_FRONTEND_URL}

spring.main.allow-bean-definition-overriding=true

gemini.api.key=${GEMINI_API_KEY}
